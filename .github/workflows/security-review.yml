# Security review of every pull request with Anthropic's Claude Code Security Reviewer.
# https://github.com/anthropics/claude-code-security-review
#
# Needs the repository secret CLAUDE_API_KEY (an Anthropic API key enabled for the
# Claude API and Claude Code). Without it the job is skipped, nothing fails.
# The action is not hardened against prompt injection: only run it on trusted PRs
# (Settings > Actions > General > "Require approval for all external contributors").

name: Security review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for the API key
        id: key
        env:
          KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::CLAUDE_API_KEY is not set, security review skipped."; fi

      # Pinned to commits, not tags (v7.0.1 and main of 2026-02-11).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        if: steps.key.outputs.present == 'true'
        with:
          comment-pr: true
          upload-results: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          claude-model: claude-opus-5-5
          exclude-directories: docs/images
          custom-security-scan-instructions: .github/security-review/instructions.txt
